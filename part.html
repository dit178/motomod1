<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MOTOMOD — Hasil</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            background: #0b0b0b;
            color: white;
            min-height: 100vh;
        }


        /* NAVBAR */

        nav {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #242424;
        }


        .logo {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 2px;
        }


        .logo span {
            color: #ff3b30;
        }


        .back {
            color: #aaa;
            text-decoration: none;
        }


        .back:hover {
            color: white;
        }


        /* HEADER */

        .header {
            width: min(1100px, 90%);
            margin: auto;
            padding: 60px 0 35px;
        }


        .small {
            color: #ff3b30;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }


        h1 {
            font-size: clamp(40px, 7vw, 70px);
            line-height: .95;
            margin-bottom: 25px;
        }


        h1 span {
            color: #ff3b30;
        }


        /* TAG */

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }


        .tag {
            background: #171717;
            border: 1px solid #292929;
            padding: 10px 15px;
            border-radius: 50px;
            color: #aaa;
            font-size: 13px;
        }


        .tag strong {
            color: white;
        }


        /* CONTENT */

        .content {
            width: min(1100px, 90%);
            margin: auto;
            padding-bottom: 80px;
        }


        .result-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }


        .result-top h2 {
            font-size: 20px;
        }


        #jumlah {
            color: #777;
            font-size: 13px;
        }


        /* PRODUCTS */

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }


        .product {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;
            overflow: hidden;
            transition: .2s;
        }


        .product:hover {
            transform: translateY(-5px);
            border-color: #555;
        }


        .product-image {
            height: 220px;
            background: #202020;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .product-info {
            padding: 20px;
        }


        .category {
            color: #ff3b30;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }


        .product h3 {
            font-size: 17px;
            margin-bottom: 10px;
        }


        .description {
            color: #777;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 15px;
        }


        .price {
            font-size: 20px;
            font-weight: bold;
        }


        .detail-button {
            display: block;
            text-align: center;
            text-decoration: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #242424;
            color: white;
        }


        .detail-button:hover {
            background: #ff3b30;
        }


        /* EMPTY */

        .empty {
            text-align: center;
            padding: 70px 20px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;
        }


        .empty p {
            color: #777;
            margin: 15px 0 25px;
        }


        .back-button {
            display: inline-block;
            background: #ff3b30;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 8px;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 550px) {

            .products {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

        </h1>


        <div class="filters">

            </div>


            <div class="tag">

    </header>


    <!-- CONTENT -->

            </h2>

            <div id="jumlah">

            </div>

        </div>


        <div
            class="products"
            id="products"
        ></div>


        <div
            class="empty"
            id="empty"
            style="display:none;"
        >

                Produk belum tersedia
            </h2>

                Belum ada part yang cocok

            </p>


            <a
                href="index.html"
                class="back-button"

                ← Ubah Pilihan
            </a>

    </main>

            );


        // =========================

        // =========================

        const productsContainer =
            document.getElementById("products");


        const empty =
            document.getElementById("empty");


        const jumlah =

        // =========================
        // JUMLAH PRODUK
        // =========================

        jumlah.textContent =
            hasil.length + " produk";


        // =========================
        // TAMPILKAN PRODUK
        // =========================

        if (hasil.length === 0) {

            empty.style.display = "block";

        } else {


            hasil.forEach(item => {


                const card =
                    document.createElement("div");


                card.className =
                    "product";


                card.innerHTML = `

                    <div class="product-image">

                        <img
                            src="${item.gambar}"
                            alt="${item.nama}"
                        >

                    </div>


                    <div class="product-info">

                        <div class="category">
                            ${item.part}
                        </div>

                            ${item.nama}
                        </h3>

                            ${item.motor}.

                            Kategori budget:

                        </div>


                        <div class="price">

                            Rp

                        <a
                            href="${item.link}"

                            target="_blank"

                    .appendChild(card);
