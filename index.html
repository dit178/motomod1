<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOTOMOD</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0b0b0b;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 75px;
            display: flex;
            align-items: center;
            padding: 0 7%;
            border-bottom: 1px solid #242424;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff3b30;
        }

        .container {
            width: min(1100px, 90%);
            margin: auto;
            padding: 70px 0;
        }

        .small-title {
            color: #ff3b30;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(40px, 7vw, 75px);
            line-height: .95;
            margin-bottom: 50px;
        }

        h1 span {
            color: #ff3b30;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* MOTOR */

        select {
            width: 100%;
            padding: 16px;
            background: #151515;
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        select:focus {
            border-color: #ff3b30;
        }

        /* PART */

        .parts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .part-card {
            padding: 30px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: .2s;
        }

        .part-card:hover {
            border-color: #ff3b30;
        }

        .part-card.selected {
            background: #ff3b30;
            border-color: #ff3b30;
        }

        /* BUDGET */

        .budgets {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .budget-card {
            padding: 30px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: .2s;
        }

        .budget-card:hover {
            border-color: #ff3b30;
        }

        .budget-card.selected {
            background: #ff3b30;
            border-color: #ff3b30;
        }

        /* BUTTON */

        .search-button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 10px;
            background: #ff3b30;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .search-button:hover {
            background: #e82d24;
        }

        @media (max-width: 550px) {

            .parts,
            .budgets {
                grid-template-columns: 1fr;
            }

            .container {
                padding-top: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            MOTO<span>MOD</span>
        </div>

    </nav>


    <!-- CONTENT -->

    <main class="container">

        <div class="small-title">
            MOTORCYCLE MODIFICATION
        </div>

        <h1>
            CARI PART<br>
            <span>MOTOR KAMU.</span>
        </h1>


        <!-- =========================
             PILIH MOTOR
        ========================== -->

        <div class="section">

            <div class="section-title">
                01 — Pilih Motor
            </div>

            <select id="motor">

                <option value="">
                    -- Pilih Motor --
                </option>

                <option value="Honda Beat">
                    Honda Beat
                </option>

                <option value="Yamaha Mio">
                    Yamaha Mio
                </option>

                <option value="Honda Vario">
                    Honda Vario
                </option>

                <option value="Yamaha Aerox">
                    Yamaha Aerox
                </option>

            </select>

        </div>


        <!-- =========================
             PILIH PART
        ========================== -->

        <div class="section">

            <div class="section-title">
                02 — Pilih Part
            </div>

            <div class="parts">

                <div
                    class="part-card"
                    data-part="Knalpot"
                >
                    <h3>🔧 KNALPOT</h3>
                </div>


                <div
                    class="part-card"
                    data-part="Velg"
                >
                    <h3>⚙️ VELG</h3>
                </div>

            </div>

        </div>


        <!-- =========================
             PILIH BUDGET
        ========================== -->

        <div class="section">

            <div class="section-title">
                03 — Pilih Budget
            </div>

            <div class="budgets">

                <div
                    class="budget-card"
                    data-budget="Pelajar"
                >
                    <h3>💰 PELAJAR</h3>
                    <p>Budget terjangkau</p>
                </div>


                <div
                    class="budget-card"
                    data-budget="Sultan"
                >
                    <h3>💎 SULTAN</h3>
                    <p>Budget premium</p>
                </div>

            </div>

        </div>


        <!-- =========================
             BUTTON
        ========================== -->

        <button
            type="button"
            class="search-button"
            id="cariPart"
        >
            🔍 CARI PART
        </button>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // MENYIMPAN PILIHAN

        let selectedPart = "";
        let selectedBudget = "";


        // =========================
        // PILIH PART
        // =========================

        document
            .querySelectorAll(".part-card")
            .forEach(card => {

                card.addEventListener("click", function () {

                    document
                        .querySelectorAll(".part-card")
                        .forEach(item => {

                            item.classList.remove("selected");

                        });


                    this.classList.add("selected");


                    selectedPart =
                        this.dataset.part;

                });

            });


        // =========================
        // PILIH BUDGET
        // =========================

        document
            .querySelectorAll(".budget-card")
            .forEach(card => {

                card.addEventListener("click", function () {

                    document
                        .querySelectorAll(".budget-card")
                        .forEach(item => {

                            item.classList.remove("selected");

                        });


                    this.classList.add("selected");


                    selectedBudget =
                        this.dataset.budget;

                });

            });


        // =========================
        // TOMBOL CARI PART
        // =========================

        document
            .getElementById("cariPart")
            .addEventListener("click", function () {


                const motor =
                    document.getElementById("motor").value;


                // CEK MOTOR

                if (motor === "") {

                    alert(
                        "⚠️ Pilih motor terlebih dahulu!"
                    );

                    return;
                }


                // CEK PART

                if (selectedPart === "") {

                    alert(
                        "⚠️ Pilih part terlebih dahulu!"
                    );

                    return;
                }


                // CEK BUDGET

                if (selectedBudget === "") {

                    alert(
                        "⚠️ Pilih budget terlebih dahulu!"
                    );

                    return;
                }


                // =========================
                // PINDAH KE PART.HTML
                // =========================

                const url =
                    "part.html" +
                    "?motor=" +
                    encodeURIComponent(motor) +
                    "&part=" +
                    encodeURIComponent(selectedPart) +
                    "&budget=" +
                    encodeURIComponent(selectedBudget);


                window.location.href = url;

            });

    </script>

</body>
</html>
